<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0B111B">
    <meta name="description" content="NaraKarsa dari Pijarkan Cita dan bukti pengundangan kampanye Marvin Dzaky Yahya No. Urut 2 untuk IMTI FTUI 2027.">
    <title>Pijarkan Cita | IMTI FTUI 2027</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baskervville:ital@1&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./navigation.css">
    <script src="./optional-images.js" defer></script>
    <script src="./campaign.config.js" defer></script>
    <script src="./site.js" defer></script>
  </head>
  <body id="atas">
    <a class="skip-link" href="#konten">Ke isi halaman</a>

    <header class="site-header">
      <nav class="site-nav" aria-label="Navigasi utama">
        <span class="nav-photo" data-optional-image="./assets/foto-header.webp" aria-hidden="true"></span>
        <a class="nav-home" href="./index.html" aria-label="Beranda Pijarkan Cita">
          <img src="./assets/logo-pijarkan-cita.png" width="258" height="272" alt="">
        </a>
        <div class="nav-links">
          <a href="./pijarkan-cita.html">Pijarkan Cita</a>
          <a href="#atas" aria-current="page">Tautan</a>
          <a class="nav-grand" href="./narakarsa.html">
            <span>NaraKarsa</span><small>Grand Design</small>
          </a>
        </div>
      </nav>
    </header>
    <main class="page" id="konten">
      <header class="hero">
        <span class="hero-spotlight" aria-hidden="true"></span>
        <div class="hero-brand">
          <div class="asset-frame logo-frame" data-asset="logo" hidden>
            <span class="asset-placeholder">
              <span>Logo kampanye</span>
              <span class="asset-path"></span>
            </span>
          </div>
          <p class="hero-org">IMTI FTUI <span>2027</span></p>
        </div>

        <div class="hero-copy">
          <p class="candidate">
            <span>Marvin Dzaky Yahya</span>
            <span class="candidate-number">No. Urut 2</span>
          </p>
          <h1><span class="hero-title-lead">Pijarkan</span> <em>Cita</em></h1>
        </div>

        <div class="portrait">
          <button class="asset-frame portrait-frame" type="button" data-asset="portrait"
            aria-label="Nyalakan kilau pada foto Marvin Dzaky Yahya" disabled hidden>
            <span class="asset-placeholder">
              <span>Foto calon</span>
              <span class="asset-path"></span>
            </span>
            <span class="portrait-flash" aria-hidden="true"></span>
          </button>
          <img class="portrait-motif motif-top" src="./assets/elemen-1.webp" width="174" height="176"
            decoding="async" alt="" draggable="false">
          <img class="portrait-motif motif-bottom" src="./assets/elemen-3.webp" width="176" height="175"
            decoding="async" alt="" draggable="false">
        </div>

        <ul class="values" aria-label="Nilai kampanye" role="list">
          <li>Inklusif</li>
          <li>Efektif</li>
          <li>Berdampak</li>
        </ul>
      </header>

      <nav class="campaign-links" aria-labelledby="links-heading">
        <h2 id="links-heading">Tautan</h2>
        <ul class="link-list" id="campaign-links"></ul>
        <p class="link-empty" id="links-empty" hidden>Tautan kampanye akan segera tersedia.</p>
        <noscript><p class="link-empty">Aktifkan JavaScript untuk melihat tautan kampanye.</p></noscript>
      </nav>

      <footer class="footer"><p>#Pija2kanCita</p></footer>
    </main>

    <template id="link-card">
      <span class="card-icon" aria-hidden="true"></span>
      <span class="card-copy">
        <span class="card-title"></span>
        <span class="card-description"></span>
      </span>
      <span class="card-action"></span>
      <span class="card-preview" hidden><img width="1600" height="900" decoding="async" alt=""></span>
    </template>
  </body>
</html>
